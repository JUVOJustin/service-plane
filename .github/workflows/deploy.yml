name: Deploy

on:
  release:
    types:
      - published

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
          import { appendFileSync, readFileSync } from "node:fs";
          const tag = process.env.RELEASE_TAG ?? "";
          const taggedVersion = tag.startsWith("v") ? tag.slice(1) : tag;
          const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
          if (taggedVersion !== packageVersion) {
            throw new Error(`Release tag ${tag} does not match package.json version ${packageVersion}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `NPM_TAG=${taggedVersion.includes("-") ? "next" : "latest"}\n`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Verify release
        run: npm run verify

      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ steps.version.outputs.NPM_TAG }}
