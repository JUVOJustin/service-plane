name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run check

      - name: Typecheck
        run: npm run typecheck

  test:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The same bundle the other runtimes execute; run it on Node too so a
      # bundling-only regression cannot hide behind a green vitest suite.
      - name: Smoke (bundled)
        run: npm run smoke:build && node smoke-dist/cli.mjs

  # The portability claim, exercised for real. workerd — the deployment runtime — runs the full
  # vitest suite inside actual isolates via vitest-pool-workers. Deno and Bun run a bundled smoke
  # (oRPC Fetch unary and streaming calls, native unary RPC, and token verification): neither has a
  # supported vitest path, and for them the claim is portability, not deployment.
  test-workerd:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test suite on workerd (vitest-pool-workers)
        run: npm run test:workerd

  smoke-deno:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Smoke on Deno
        run: npm run smoke:build && deno run smoke-dist/cli.mjs

  smoke-bun:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Smoke on Bun
        run: npm run smoke:build && bun smoke-dist/cli.mjs
